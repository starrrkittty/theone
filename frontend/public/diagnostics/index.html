<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>骨架阶段回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#20292d;font:14px system-ui,sans-serif;letter-spacing:0}header{background:#fff;border-bottom:1px solid #ccd5da;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:22px;margin:0}a{color:#087267}main{max-width:1400px;margin:auto;padding:20px}select,button{font:inherit;padding:8px;border:1px solid #aab9bf;border-radius:4px;background:white;max-width:100%}button{cursor:pointer}#notice{padding:12px;background:#fff1cf;border-left:4px solid #b37b0c;line-height:1.7}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}.view{min-width:0}h2{font-size:16px;margin:12px 0}canvas{display:block;width:100%;background:white;border:1px solid #d0d9dd}#controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#seek{flex:1;min-width:140px}#status{padding:12px 0;line-height:1.8}.stages{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.stages button[aria-selected=true]{background:#12685f;color:white}.artifact{background:white;border-top:2px solid #12685f;padding:14px}pre{overflow:auto;max-height:560px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace}#description{color:#4a5961;line-height:1.7}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:650px){main{padding:12px}.views{grid-template-columns:1fr}header{padding:12px}#samples{width:100%}}
</style>
<header><h1>骨架阶段回放</h1><a href="http://127.0.0.1:8802/#offline-video">真实视频全链路</a><select id="samples" aria-label="选择样本"></select><label>导入分析产物 <input id="import" type="file" accept=".json,application/json"></label></header>
<main><div id="notice">正在载入样本…</div>
<div class="views"><section class="view"><h2>输入骨架 · 正面投影</h2><canvas id="raw" width="600" height="360"></canvas></section><section class="view"><h2>滤波骨架 · 正面投影</h2><canvas id="filtered" width="600" height="360"></canvas></section></div>
<div id="controls"><button id="play" title="播放或暂停" aria-label="播放或暂停">▶</button><input id="seek" type="range" min="0" max="0" value="0" aria-label="样本帧"><span id="frame"></span></div>
<div id="status"></div><h2>逐帧识别状态 · 点击定位</h2><canvas id="timeline" width="1200" height="52"></canvas>
<h2>肘膝夹角（度） · 滤波图像坐标估计</h2><canvas id="angles" width="1200" height="210"></canvas>
<div class="stages" id="stages"></div><section class="artifact"><div class="toolbar"><h2 id="title"></h2><button id="download">下载当前产物</button><button id="all">下载完整样本链路</button></div><p id="description"></p><pre id="artifact"></pre></section></main>
<script>
const $=id=>document.getElementById(id);let sample,index=0,stage=0,playing=false,last=0,loading=0;
const labels={squat:'深蹲',pushup:'俯卧撑',plank:'平板支撑',bicep_curl:'弯举',alternate_bicep_curl:'交替弯举',unknown:'未知'};
const stages=['已有骨架 JSON','滤波骨架','识别结果','URDF XML','解析 JSON','整组回看','B 组输入与规则评价','专家汇报 / 规划'];
const notes=['输入为已有骨架，未经过当前视频姿态模型。公开样本的可见度为映射假定值，不能当作真实检测置信度。','滤波结果用于后续动作识别；画面仅显示 x/y 投影，完整 xyz 在 JSON 中。','识别先于 URDF 拟合。候选、确认状态及交接原因可定位漏识别阶段。','URDF 描述简化结构；随时间变化的关节状态另存于 JSON。当前仅包含肘膝四个弯曲代理关节。','这里是实际拟合与解析产物。position_rad 为弯曲量；夹角 = 180 − 弯曲量 × 180 / π。图像坐标未经尺度或角度标定。','整组结束后的二次回看结果；回填帧不能当作实时正确识别帧。','实际调用本地适配器和规则评价；被交接策略阻止时显示原因。规则评价不等同于模型专家生成内容。','本次导出没有调用 API，因此没有模型生成的专家报告和健身规划。'];
stages.forEach((name,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${name}`;b.onclick=()=>{stage=i;artifact()};$('stages').append(b)});
const edges=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function point(p){return Array.isArray(p)?p:[p.x,p.y,p.z,p.visibility]}
function bounds(){const points=sample.frames.flatMap(f=>(f.input.landmarks||[]).filter((p,i)=>i>=11&&i<=28).map(point));if(!points.length)return [0,1,0,1];const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);return [Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)]}
function skeleton(id,points,color){const c=$(id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(!points?.length){ctx.fillStyle='#666';ctx.fillText('无骨架',30,30);return}const p=points.map(point),[x0,x1,y0,y1]=sample.bounds,aspect=sample.frames[index].input.image_aspect_ratio||1;const scale=Math.min(520/(Math.max(.01,x1-x0)*aspect),290/Math.max(.01,y1-y0));const xy=i=>[300+(p[i][0]-(x0+x1)/2)*scale*aspect,180+(p[i][1]-(y0+y1)/2)*scale];ctx.strokeStyle=color;ctx.lineWidth=3;for(const [a,b] of edges){if(!p[a]||!p[b])continue;ctx.globalAlpha=Math.min(p[a][3],p[b][3])>=.5?1:.25;ctx.beginPath();ctx.moveTo(...xy(a));ctx.lineTo(...xy(b));ctx.stroke()}ctx.globalAlpha=1;for(const i of [...new Set(edges.flat())]){if(!p[i])continue;ctx.fillStyle=color;ctx.beginPath();ctx.arc(...xy(i),4,0,7);ctx.fill();ctx.font='11px sans-serif';ctx.fillText(i,...xy(i).map(v=>v+6))}}
function included(points,ids,aspect){if(!points?.length)return null;const p=ids.map(i=>point(points[i]));const a=p[0].slice(0,3).map((v,i)=>(v-p[1][i])*(i===1?1/aspect:1)),b=p[2].slice(0,3).map((v,i)=>(v-p[1][i])*(i===1?1/aspect:1));const d=Math.hypot(...a)*Math.hypot(...b);return d?Math.acos(Math.max(-1,Math.min(1,a.reduce((s,v,i)=>s+v*b[i],0)/d)))*180/Math.PI:null}
function graphs(){const t=$('timeline'),ctx=t.getContext('2d'),n=sample.frames.length;ctx.clearRect(0,0,t.width,t.height);sample.frames.forEach((f,i)=>{ctx.fillStyle=f.action_report.recognition_status==='confirmed'?'#188574':f.action_report.recognition_status==='candidate'?'#d19723':'#b7c1c7';ctx.fillRect(i*t.width/n,0,t.width/n+1,34)});ctx.fillStyle='#222';ctx.fillText('绿色：确认　黄色：候选　灰色：未确认',10,48);ctx.fillRect(index*t.width/n,0,2,34);const c=$('angles'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);for(let a=0;a<=180;a+=45){let y=180-a*150/180;g.strokeStyle='#dce2e5';g.beginPath();g.moveTo(40,y);g.lineTo(1180,y);g.stroke();g.fillStyle='#444';g.fillText(a,6,y)}const joints=[[11,13,15],[12,14,16],[23,25,27],[24,26,28]],colors=['#128475','#a6387a','#3069bd','#be7512'];joints.forEach((ids,k)=>{g.strokeStyle=colors[k];g.beginPath();let active=false;sample.frames.forEach((f,i)=>{const a=included(f.filtered_landmarks,ids,1);if(a===null){active=false;return}let x=40+i*1140/Math.max(1,n-1),y=180-a*150/180;if(active)g.lineTo(x,y);else g.moveTo(x,y);active=true});g.stroke();g.fillStyle=colors[k];g.fillText(['左肘','右肘','左膝','右膝'][k],60+k*110,202)});g.strokeStyle='#111';g.beginPath();g.moveTo(40+index*1140/Math.max(1,n-1),20);g.lineTo(40+index*1140/Math.max(1,n-1),180);g.stroke()}
function value(){const f=sample.frames[index];return [f.input,{landmarks:f.filtered_landmarks,coordinate_space:'image_width_normalized'},{candidate:f.candidate,source:f.source,action_report:f.action_report,policy:f.policy,event:f.event,timings_ms:f.timings_ms},f.urdf_xml,f.action_report.kinematics,sample.completed_set,sample.b_group,sample.model_agents][stage]}
function artifact(){if(!sample)return;$('title').textContent=stages[stage];$('description').textContent=notes[stage];$('artifact').textContent=typeof value()==='string'?value():JSON.stringify(value(),null,2);[...$('stages').children].forEach((b,i)=>b.setAttribute('aria-selected',i===stage))}
function render(){if(!sample)return;const f=sample.frames[index],r=f.action_report;$('seek').value=index;$('frame').textContent=`${index+1} / ${sample.frames.length} · ${(f.input.timestamp_ms/1000).toFixed(2)} 秒`;$('status').textContent=`片段参考：${labels[sample.expected]||sample.expected} ｜ 候选：${f.candidate||'无'} ｜ 识别：${r.recognized_exercise} ｜ 状态：${r.recognition_status} ｜ 置信度：${r.recognition_confidence.toFixed(3)} ｜ 次数：${r.repetition} ｜ 交接：${f.policy.handoff_allowed?'允许':'阻止'}`;skeleton('raw',f.input.landmarks,'#3069bd');skeleton('filtered',(f.filtered_landmarks||[]).map(p=>[p[0],p[1]*(f.input.image_aspect_ratio||1),p[2],p[3]]),'#128475');graphs();artifact()}
async function load(file){const request=++loading;playing=false;$('play').textContent='▶';const response=await fetch(file);if(!response.ok)throw Error('样本加载失败');const data=await response.json();if(request!==loading)return;sample=data;index=0;sample.bounds=bounds();$('seek').max=sample.frames.length-1;$('notice').textContent=`${sample.id} ｜ ${sample.evidence_type} ｜ 无原始视频。${sample.evidence_type==='public_skeleton_derived'?'公开骨架映射样本：重建映射尚未对照官方加载器验证，标签由片段传播至各帧；仅限本地研究。':'人工合成工程样本，不能证明真实视频准确率。'} 骨架编号采用 MediaPipe 关节编号。` ;render()}
$('seek').oninput=()=>{index=+$('seek').value;render()};$('timeline').onclick=e=>{index=Math.min(sample.frames.length-1,Math.floor((e.clientX-e.target.getBoundingClientRect().left)/e.target.getBoundingClientRect().width*sample.frames.length));render()};$('play').onclick=()=>{playing=!playing;last=0;$('play').textContent=playing?'Ⅱ':'▶'};
function tick(now){if(playing&&sample){if(!last)last=now;const next=sample.frames[(index+1)%sample.frames.length],current=sample.frames[index];const dt=Math.max(20,next.input.timestamp_ms-current.input.timestamp_ms);if(now-last>=dt){index=(index+1)%sample.frames.length;last=now;render()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function download(data,name){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('download').onclick=()=>download(value(),`${sample.id}-stage-${stage+1}${stage===3?'.urdf':'.json'}`);$('all').onclick=()=>{const {bounds,...data}=sample;download(data,`${sample.id}-trace.json`)};
$('import').onchange=async e=>{try{const file=e.target.files?.[0];if(!file)return;const data=JSON.parse(await file.text());if(!Array.isArray(data.trace)||!data.trace.length)throw Error('请导入启用了逐帧产物的视频分析文件');if(data.trace.some(f=>!f.input||!f.action_report))throw Error('逐帧输入缺失，请重新导出');loading++;playing=false;$('play').textContent='▶';const origin=data.trace[0].input.timestamp;sample={id:data.session_id,expected:'unknown',evidence_type:'user_video_model_estimates',frames:data.trace.map(f=>({...f,input:{...f.input,timestamp_ms:f.input.timestamp-origin+(data.capture_metadata?.start_seconds||0)*1000}})),completed_set:{...data,trace:undefined},b_group:data.segments?.map(s=>({action_report:s.action_report,analysis:s.analysis,perception_review:s.perception_review,agent_error:s.agent_error})),model_agents:{executed:data.segments?.some(s=>s.analysis?.model_called||s.perception_review?.perception_agent?.model_called)||false,segments:data.segments?.map(s=>({analysis:s.analysis,agent_error:s.agent_error}))}};index=0;sample.bounds=bounds();$('seek').max=sample.frames.length-1;$('notice').textContent=`${sample.id} ｜ 用户视频姿态估计 ｜ 此文件仅包含骨架与分析数据，未包含原始视频。参考动作标签未提供；可见度为模型分数。`;render()}catch(error){$('notice').textContent=error.message}};
fetch('index.json').then(r=>{if(!r.ok)throw Error('清单加载失败');return r.json()}).then(list=>{for(const s of list){const o=document.createElement('option');o.value=s.file;o.textContent=`${s.type==='public_skeleton_derived'?'公开骨架':'合成'} · ${s.id} · ${labels[s.expected]||s.expected}`;$('samples').append(o)}$('samples').onchange=()=>load($('samples').value).catch(e=>$('notice').textContent=e.message);return load(list[0].file)}).catch(e=>$('notice').textContent=e.message);
</script></html>
